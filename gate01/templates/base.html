<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>社内問い合わせ管理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <span>社内問い合わせ管理システム</span>
  {% if user %}<span class="login">ログイン中：{{ user.name }}（{{ user.role }}） <a href="{{ url_for('logout') }}">切替</a></span>{% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash flash-{{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
